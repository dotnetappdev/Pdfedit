# Cloudflare Worker for the website's "Ask the guide" assistant. See README.md.
name = "pdfedit-ask"
main = "ask-worker.js"
compatibility_date = "2026-01-01"

[vars]
SITE_URL = "https://dotnetappdev.github.io/Pdfedit/"
ALLOWED_ORIGINS = "https://dotnetappdev.github.io"
MODEL = "claude-haiku-5-5"

# At most 10 questions a minute from one visitor.
[[unsafe.bindings]]
name = "LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
