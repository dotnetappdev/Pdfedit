<!doctype html>
<html lang="en">
<head>
<title>What's new in PdfEdit</title>
<meta name="description" content="Every PdfEdit release and what changed in it.">
<!-- @include head -->
</head>
<body data-page="whats-new">
<!-- @include header -->
<main id="main">
  <div class="wrap">
    <div class="grid-2">
      <div>
        <h1>What's new</h1>
        <p class="muted">Every release, newest first. This page updates itself when a new version comes out.</p>
        <div data-changelog><p class="loading">Loading the release history...</p></div>
      </div>
      <aside>
        <div class="box">
          <h2>Get the latest</h2>
          <div class="body">
            <p style="font-size:1.4rem;font-weight:700;margin:0">PdfEdit <span data-latest-version>...</span></p>
            <p class="muted">Released <span data-latest-date>...</span></p>
            <a class="btn go" href="download.html" style="width:100%;justify-content:center">Download</a>
          </div>
        </div>
        <div class="box">
          <h2>Follow along</h2>
          <div class="body">
            <ul class="plain">
              <li><a href="https://github.com/dotnetappdev/pdfedit/releases.atom">Releases feed (RSS/Atom)</a></li>
              <li><a href="https://github.com/dotnetappdev/pdfedit/releases">All releases on GitHub</a></li>
              <li><a href="https://github.com/dotnetappdev/pdfedit/commits/devmain">Every change as it happens</a></li>
            </ul>
          </div>
        </div>
      </aside>
    </div>
  </div>
</main>
<!-- @include footer -->
</body>
</html>
