<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <!-- High Contrast Theme Mockup -->
  <rect width="900" height="560" fill="#000000"/>

  <!-- Title bar -->
  <rect width="900" height="28" fill="#000000"/>
  <text x="450" y="19" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="12">PdfEdit — document.pdf</text>
  <rect x="840" y="4" width="20" height="20" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <text x="850" y="18" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="11">−</text>
  <rect x="866" y="4" width="20" height="20" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <text x="876" y="18" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="10">□</text>
  <rect x="872" y="4" width="14" height="20" fill="#C50000" stroke="#FFFFFF" stroke-width="1"/>
  <text x="879" y="18" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="11">✕</text>

  <!-- Ribbon background -->
  <rect y="28" width="900" height="88" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1"/>

  <!-- Ribbon tab strip -->
  <rect y="28" width="900" height="28" fill="#050505"/>
  <rect x="0" y="28" width="60" height="28" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="1"/>
  <text x="30" y="46" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="11" font-weight="bold">Home</text>
  <rect x="60" y="28" width="72" height="28" fill="#050505" stroke="#555" stroke-width="0.5"/>
  <text x="96" y="46" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="11">Fill &amp; Sign</text>
  <rect x="132" y="28" width="50" height="28" fill="#050505" stroke="#555" stroke-width="0.5"/>
  <text x="157" y="46" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="11">Forms</text>
  <rect x="182" y="28" width="50" height="28" fill="#050505" stroke="#555" stroke-width="0.5"/>
  <text x="207" y="46" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="11">Tools</text>
  <rect x="232" y="28" width="80" height="28" fill="#050505" stroke="#555" stroke-width="0.5"/>
  <text x="272" y="46" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="11">AI Assistant</text>
  <rect x="312" y="28" width="56" height="28" fill="#050505" stroke="#555" stroke-width="0.5"/>
  <text x="340" y="46" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="11">Design</text>

  <!-- Ribbon buttons row -->
  <rect x="8" y="60" width="50" height="50" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="33" y="78" text-anchor="middle" fill="#FFFF00" font-family="Segoe UI" font-size="18">📂</text>
  <text x="33" y="104" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="10">Open</text>

  <rect x="62" y="60" width="50" height="50" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="87" y="78" text-anchor="middle" fill="#FFFF00" font-family="Segoe UI" font-size="18">💾</text>
  <text x="87" y="104" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="10">Save</text>

  <rect x="116" y="60" width="50" height="50" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="141" y="78" text-anchor="middle" fill="#FFFF00" font-family="Segoe UI" font-size="18">✍</text>
  <text x="141" y="104" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="10">Sign</text>

  <rect x="170" y="60" width="50" height="50" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="195" y="78" text-anchor="middle" fill="#FFFF00" font-family="Segoe UI" font-size="18">🔍</text>
  <text x="195" y="104" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="10">Search</text>

  <!-- Divider -->
  <line x1="228" y1="62" x2="228" y2="108" stroke="#FFFFFF" stroke-width="1"/>

  <rect x="234" y="60" width="50" height="50" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="259" y="78" text-anchor="middle" fill="#00FFFF" font-family="Segoe UI" font-size="18">◉</text>
  <text x="259" y="104" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="10">Stamp</text>

  <rect x="288" y="60" width="50" height="50" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="313" y="78" text-anchor="middle" fill="#00FFFF" font-family="Segoe UI" font-size="18">🖊</text>
  <text x="313" y="104" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="10">Freehand</text>

  <!-- Divider -->
  <line x1="346" y1="62" x2="346" y2="108" stroke="#FFFFFF" stroke-width="1"/>

  <rect x="352" y="60" width="50" height="50" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="377" y="78" text-anchor="middle" fill="#00FF00" font-family="Segoe UI" font-size="18">🤖</text>
  <text x="377" y="104" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="10">Smart Fill</text>

  <!-- Theme badge -->
  <rect x="720" y="60" width="170" height="50" fill="#0A0A0A" stroke="#FFFF00" stroke-width="2"/>
  <text x="805" y="80" text-anchor="middle" fill="#FFFF00" font-family="Segoe UI" font-size="11" font-weight="bold">⬛ HIGH CONTRAST</text>
  <text x="805" y="99" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="10">Theme: Active</text>

  <!-- Left toolbar -->
  <rect x="0" y="116" width="46" height="444" fill="#050505" stroke="#FFFFFF" stroke-width="1"/>
  <text x="23" y="144" text-anchor="middle" fill="#FFFF00" font-family="Segoe UI" font-size="14">☜</text>
  <text x="23" y="170" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="10">Hand</text>
  <text x="23" y="200" text-anchor="middle" fill="#FFFF00" font-family="Segoe UI" font-size="14">T</text>
  <text x="23" y="220" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="10">Text</text>
  <text x="23" y="252" text-anchor="middle" fill="#FFFF00" font-family="Segoe UI" font-size="14">✒</text>
  <text x="23" y="272" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="10">Sign</text>
  <text x="23" y="304" text-anchor="middle" fill="#00FFFF" font-family="Segoe UI" font-size="14">▭</text>
  <text x="23" y="324" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="10">Rect</text>
  <text x="23" y="356" text-anchor="middle" fill="#00FFFF" font-family="Segoe UI" font-size="14">◯</text>
  <text x="23" y="376" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="10">Ellipse</text>
  <text x="23" y="408" text-anchor="middle" fill="#00FFFF" font-family="Segoe UI" font-size="14">➤</text>
  <text x="23" y="428" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="10">Arrow</text>
  <text x="23" y="460" text-anchor="middle" fill="#00FF00" font-family="Segoe UI" font-size="14">💬</text>
  <text x="23" y="480" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="10">Callout</text>

  <!-- Page thumbnail panel -->
  <rect x="46" y="116" width="90" height="444" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1"/>
  <text x="91" y="136" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="10">PAGES</text>
  <rect x="56" y="142" width="70" height="90" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/>
  <text x="91" y="192" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="9">Page 1</text>
  <rect x="56" y="244" width="70" height="90" fill="#0A0A0A" stroke="#555" stroke-width="1"/>
  <text x="91" y="294" text-anchor="middle" fill="#888" font-family="Segoe UI" font-size="9">Page 2</text>
  <rect x="56" y="346" width="70" height="90" fill="#0A0A0A" stroke="#555" stroke-width="1"/>
  <text x="91" y="396" text-anchor="middle" fill="#888" font-family="Segoe UI" font-size="9">Page 3</text>

  <!-- Main PDF view area -->
  <rect x="136" y="116" width="620" height="444" fill="#111111"/>

  <!-- Document area tabs -->
  <rect x="136" y="116" width="100" height="26" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="186" y="133" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="11" font-weight="bold">Live View</text>
  <rect x="236" y="116" width="80" height="26" fill="#0A0A0A" stroke="#555" stroke-width="1"/>
  <text x="276" y="133" text-anchor="middle" fill="#AAAAAA" font-family="Segoe UI" font-size="11">Design</text>

  <!-- PDF document page -->
  <rect x="176" y="152" width="380" height="380" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Page content -->
  <rect x="196" y="172" width="340" height="16" fill="#000000" rx="2"/>
  <text x="366" y="184" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="12" font-weight="bold">EMPLOYMENT CONTRACT</text>
  <rect x="196" y="200" width="200" height="8" fill="#333333" rx="1"/>
  <rect x="196" y="216" width="260" height="8" fill="#333333" rx="1"/>
  <rect x="196" y="232" width="180" height="8" fill="#333333" rx="1"/>
  <!-- Form field with HC outline -->
  <rect x="196" y="256" width="150" height="22" fill="none" stroke="#0080FF" stroke-width="2"/>
  <text x="201" y="271" fill="#333333" font-family="Segoe UI" font-size="10">John Smith</text>
  <rect x="276" y="256" width="120" height="22" fill="none" stroke="#FF0000" stroke-width="2"/>
  <text x="281" y="268" fill="#888" font-family="Segoe UI" font-size="9">[Required]</text>
  <!-- Callout annotation example -->
  <rect x="370" y="200" width="120" height="50" fill="#FFFF99" stroke="#000000" stroke-width="2" rx="3"/>
  <text x="430" y="218" text-anchor="middle" fill="#000000" font-family="Segoe UI" font-size="9">Review this</text>
  <text x="430" y="232" text-anchor="middle" fill="#000000" font-family="Segoe UI" font-size="9">clause carefully</text>
  <polygon points="420,250 440,250 430,266" fill="#FFFF99" stroke="#000000" stroke-width="2"/>
  <!-- Highlight example -->
  <rect x="196" y="296" width="180" height="12" fill="#FFFF00" opacity="0.6"/>
  <text x="196" y="307" fill="#333333" font-family="Segoe UI" font-size="10">Important clause highlighted in yellow</text>

  <!-- Right panel -->
  <rect x="756" y="116" width="144" height="444" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1"/>
  <text x="828" y="136" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="10">PROPERTIES</text>
  <rect x="766" y="146" width="124" height="1" fill="#FFFFFF"/>
  <text x="776" y="162" fill="#AAAAAA" font-family="Segoe UI" font-size="9">Font Family</text>
  <rect x="766" y="166" width="124" height="20" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="1"/>
  <text x="778" y="180" fill="#FFFFFF" font-family="Segoe UI" font-size="10">Segoe UI</text>
  <text x="776" y="202" fill="#AAAAAA" font-family="Segoe UI" font-size="9">Font Size</text>
  <rect x="766" y="206" width="60" height="20" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="1"/>
  <text x="796" y="220" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="10">12</text>
  <text x="776" y="244" fill="#AAAAAA" font-family="Segoe UI" font-size="9">Theme</text>
  <rect x="766" y="248" width="124" height="24" fill="#1A1A1A" stroke="#FFFF00" stroke-width="2"/>
  <text x="828" y="264" text-anchor="middle" fill="#FFFF00" font-family="Segoe UI" font-size="10" font-weight="bold">High Contrast</text>

  <!-- Status bar -->
  <rect x="0" y="536" width="900" height="24" fill="#000000" stroke="#FFFFFF" stroke-width="1"/>
  <text x="12" y="552" fill="#FFFFFF" font-family="Segoe UI" font-size="10">Page 1 of 3  |  Zoom: 100%  |  Theme: High Contrast  |  Ready</text>

  <!-- Label -->
  <rect x="330" y="490" width="240" height="30" fill="#FFFF00" rx="4"/>
  <text x="450" y="510" text-anchor="middle" fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold">High Contrast Theme</text>
</svg>
