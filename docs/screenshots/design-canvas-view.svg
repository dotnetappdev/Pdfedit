  <text x="780" y="176" fill="#CCCCCC" font-family="Segoe UI" font-size="10">Segoe UI</text>

  <text x="770" y="196" fill="#888" font-family="Segoe UI" font-size="9">Font Size</text>
  <rect x="768" y="200" width="60" height="20" fill="#3C3C3C" stroke="#555" stroke-width="1" rx="2"/>
  <text x="798" y="214" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="10">12</text>

  <text x="770" y="234" fill="#888" font-family="Segoe UI" font-size="9">Fill Color</text>
  <rect x="768" y="238" width="20" height="20" fill="#1A56A0" stroke="#555" stroke-width="1" rx="2"/>
  <text x="796" y="252" fill="#CCCCCC" font-family="Segoe UI" font-size="10">#1A56A0</text>

