  <text x="70" y="347" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="11">➤  Arrow</text>

  <rect x="8" y="362" width="124" height="32" fill="#3C3C3C" rx="4"/>
  <text x="70" y="383" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="11">🖊  Pen</text>

  <rect x="8" y="398" width="124" height="32" fill="#3C3C3C" rx="4"/>
  <text x="70" y="419" text-anchor="middle" fill="#CCCCCC" font-family="Segoe UI" font-size="11">🖼  Image</text>

