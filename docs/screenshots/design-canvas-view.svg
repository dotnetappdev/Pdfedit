  <circle cx="450" cy="252" r="4" fill="#0A84FF" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="672" cy="252" r="4" fill="#0A84FF" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="228" cy="382" r="4" fill="#0A84FF" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="672" cy="382" r="4" fill="#0A84FF" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Text element -->
