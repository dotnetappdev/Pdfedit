  <text x="12" y="552" fill="#CCCCCC" font-family="Segoe UI" font-size="10">Design Mode  |  Page: A4  |  Elements: 6  |  Selected: Table (4×4)  |  Zoom: 100%</text>

  <!-- Label badge -->
