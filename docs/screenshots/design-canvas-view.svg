  <line x1="548" y1="252" x2="548" y2="382" stroke="#CCCCCC" stroke-width="0.5"/>
  <line x1="610" y1="252" x2="610" y2="382" stroke="#CCCCCC" stroke-width="0.5"/>
  <line x1="228" y1="276" x2="672" y2="276" stroke="#CCCCCC" stroke-width="0.5"/>
  <text x="248" y="293" fill="#333333" font-family="Segoe UI" font-size="9">Web Design Services</text>
  <text x="520" y="293" text-anchor="middle" fill="#333333" font-family="Segoe UI" font-size="9">5</text>
  <text x="580" y="293" text-anchor="middle" fill="#333333" font-family="Segoe UI" font-size="9">$500</text>
  <text x="648" y="293" text-anchor="middle" fill="#333333" font-family="Segoe UI" font-size="9">$2,500</text>
  <line x1="228" y1="300" x2="672" y2="300" stroke="#EEEEEE" stroke-width="0.5"/>
  <text x="248" y="317" fill="#333333" font-family="Segoe UI" font-size="9">SEO Optimization</text>
  <text x="520" y="317" text-anchor="middle" fill="#333333" font-family="Segoe UI" font-size="9">3</text>
  <text x="580" y="317" text-anchor="middle" fill="#333333" font-family="Segoe UI" font-size="9">$300</text>
  <text x="648" y="317" text-anchor="middle" fill="#333333" font-family="Segoe UI" font-size="9">$900</text>
  <line x1="228" y1="324" x2="672" y2="324" stroke="#EEEEEE" stroke-width="0.5"/>
  <text x="248" y="341" fill="#333333" font-family="Segoe UI" font-size="9">Content Writing</text>
  <text x="520" y="341" text-anchor="middle" fill="#333333" font-family="Segoe UI" font-size="9">8</text>
  <text x="580" y="341" text-anchor="middle" fill="#333333" font-family="Segoe UI" font-size="9">$150</text>
  <text x="648" y="341" text-anchor="middle" fill="#333333" font-family="Segoe UI" font-size="9">$1,200</text>
  <line x1="228" y1="348" x2="672" y2="348" stroke="#CCCCCC" stroke-width="0.5"/>
  <!-- Total row -->
  <rect x="548" y="358" width="124" height="24" fill="#F0F4FF"/>
  <text x="578" y="374" fill="#333333" font-family="Segoe UI" font-size="10" font-weight="bold">TOTAL</text>
  <text x="648" y="374" text-anchor="middle" fill="#1A56A0" font-family="Segoe UI" font-size="10" font-weight="bold">$4,600</text>

  <!-- Selection handles on table -->
