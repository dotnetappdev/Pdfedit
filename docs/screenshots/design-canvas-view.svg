  <text x="745" y="98" text-anchor="middle" fill="#DDDDFF" font-family="Segoe UI" font-size="9">Ctrl+Shift+E</text>

  <rect x="796" y="60" width="96" height="50" fill="#2D8A2D" stroke="none" rx="4"/>
  <text x="844" y="80" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI" font-size="11" font-weight="bold">Open as PDF</text>
  <text x="844" y="98" text-anchor="middle" fill="#CCFFCC" font-family="Segoe UI" font-size="9">Preview &amp; Fill</text>

