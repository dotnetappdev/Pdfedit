  <!-- Contract content -->
  <text x="400" y="180" text-anchor="middle" fill="#111111" font-family="Segoe UI" font-size="14" font-weight="bold">EMPLOYMENT CONTRACT</text>
  <line x1="230" y1="188" x2="570" y2="188" stroke="#AAAAAA" stroke-width="0.5"/>

  <text x="230" y="208" fill="#333333" font-family="Segoe UI" font-size="10">This Agreement is entered into as of January 1, 2025, between:</text>
  <text x="230" y="224" fill="#333333" font-family="Segoe UI" font-size="10">Employer: Acme Corporation ("Company")</text>
  <text x="230" y="240" fill="#333333" font-family="Segoe UI" font-size="10">Employee: John Smith ("Employee")</text>

  <text x="230" y="264" fill="#333333" font-family="Segoe UI" font-size="10" font-weight="bold">1. POSITION AND DUTIES</text>
  <!-- Highlight annotation -->
  <rect x="230" y="278" width="260" height="13" fill="#FFD700" opacity="0.4"/>
  <text x="230" y="289" fill="#333333" font-family="Segoe UI" font-size="10">The Employee shall serve as Senior Developer</text>
  <text x="230" y="305" fill="#333333" font-family="Segoe UI" font-size="10">and perform such duties as assigned by the Company.</text>

  <text x="230" y="329" fill="#333333" font-family="Segoe UI" font-size="10" font-weight="bold">2. COMPENSATION</text>
  <text x="230" y="345" fill="#333333" font-family="Segoe UI" font-size="10">Annual salary: $120,000, payable bi-weekly.</text>
  <!-- Callout annotation -->
  <rect x="380" y="330" width="160" height="48" fill="#FFFDE7" stroke="#C62828" stroke-width="2" rx="3"/>
  <text x="388" y="348" fill="#222" font-family="Segoe UI" font-size="9">Verify against</text>
  <text x="388" y="362" fill="#222" font-family="Segoe UI" font-size="9">offer letter #2024-87</text>
  <text x="388" y="376" fill="#222" font-family="Segoe UI" font-size="9">before signing</text>
  <polygon points="450,378 470,378 460,394" fill="#FFFDE7" stroke="#C62828" stroke-width="2"/>

  <text x="230" y="414" fill="#333333" font-family="Segoe UI" font-size="10" font-weight="bold">3. CONFIDENTIALITY</text>
  <text x="230" y="430" fill="#333333" font-family="Segoe UI" font-size="10">Employee agrees to keep all proprietary information</text>
  <!-- Sticky note pin -->
  <text x="556" y="432" fill="#FFB300" font-family="Segoe UI" font-size="16">📌</text>

  <!-- Signature field overlay -->
  <rect x="230" y="500" width="160" height="36" fill="none" stroke="#0A84FF" stroke-width="1.5" stroke-dasharray="4,2" rx="2"/>
