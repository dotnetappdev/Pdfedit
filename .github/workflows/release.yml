name: Build & Release

on:
  # Every push to main (e.g. merging devmain) builds and publishes a release automatically:
  # the version is the next patch after the latest v* tag (or the <Version> if higher).
  # devmain (where development happens): a release is published whenever the <Version> in
  # Directory.Build.props has not been released yet. Bump it there to ship the next one; every
  # project and every file in the release gets that same number.
  push:
    branches: [main, devmain]
    paths-ignore:
      - '**.md'
      - 'docs/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # e.g. v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # e.g. v1.2.3-beta.1

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3). Leave blank to read from Directory.Build.props.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write   # needed to create releases and upload assets

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  # ── Job 1: Resolve version and metadata ───────────────────────────────────
  metadata:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version:     ${{ steps.ver.outputs.version }}
      version4:    ${{ steps.ver.outputs.version4 }}
      tag:         ${{ steps.ver.outputs.tag }}
      prerelease:  ${{ steps.ver.outputs.prerelease }}
      release:     ${{ steps.ver.outputs.release }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, to find the latest release

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # Priority: tag > workflow_dispatch input > Directory.Build.props
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            # Is it a pre-release? (has a hyphen suffix like -beta.1)
            if [[ "$VERSION" == *-* ]]; then PRE=true; else PRE=false; fi
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
            PRE="${{ github.event.inputs.prerelease }}"
          elif [[ "$GITHUB_REF" == refs/heads/devmain ]]; then
            # devmain: release the Directory.Build.props version once (skip if that tag already exists).
            VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
            TAG="v${VERSION}"
            PRE=false
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "$TAG is already released — bump <Version> in Directory.Build.props to publish a new release."
            fi
          else
            # main: next patch after the latest release tag, or the Directory.Build.props version if newer.
            CSPROJ=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
            LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -vE -- '-' | sed 's/^v//' | sort -V | tail -1)
            if [[ -z "$LATEST" ]]; then
              VERSION="$CSPROJ"
            else
              IFS=. read -r MA MI PA <<< "$LATEST"
              NEXT="$MA.$MI.$((PA + 1))"
              # Directory.Build.props wins when someone bumped it past the last release (e.g. 1.1.0)
              if [[ "$(printf '%s\n%s\n' "$NEXT" "$CSPROJ" | sort -V | tail -1)" == "$CSPROJ" && "$CSPROJ" != "$LATEST" ]]; then
                VERSION="$CSPROJ"
              else
                VERSION="$NEXT"
              fi
            fi
            TAG="v${VERSION}"
            PRE=false
          fi

          # 4-part version (x.y.z.0) for the assembly and file versions
          BASE="${VERSION%%-*}"          # strip pre-release suffix
          PARTS=$(echo "$BASE" | tr '.' '\n' | wc -l)
          if [[ $PARTS -eq 3 ]]; then VERSION4="${BASE}.0"; else VERSION4="${BASE}"; fi

          echo "version=$VERSION"    >> "$GITHUB_OUTPUT"
          echo "version4=$VERSION4"  >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE"     >> "$GITHUB_OUTPUT"
          echo "Resolved: version=$VERSION  version4=$VERSION4  tag=$TAG  prerelease=$PRE"

  # ── Job 2: PdfEdit for Windows (installer and portable ZIP) ────────────────
  # The three build jobs run side by side and only keep their files; the publish job makes the
  # release once, with everything in it, so a release is never edited after it's out.
  windows:
    name: Windows installer and portable ZIP
    runs-on: windows-latest
    needs: metadata
    if: needs.metadata.outputs.release != 'false'

    env:
      VERSION:   ${{ needs.metadata.outputs.version }}
      VERSION4:  ${{ needs.metadata.outputs.version4 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── .NET ────────────────────────────────────────────────────────────────
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Restore
        run: dotnet restore PdfEdit/PdfEdit.csproj

      - name: Build (Release)
        run: |
          dotnet build PdfEdit/PdfEdit.csproj `
            -c Release --no-restore `
            /p:Version=$env:VERSION `
            /p:AssemblyVersion=$env:VERSION4 `
            /p:FileVersion=$env:VERSION4

      # ── Portable ZIP and installer ────────────────────────────────────────
      # Windows gets two files: PdfEditSetup-<v>.exe and PdfEdit-<v>-win-x64-portable.zip, both
      # self-contained (.NET included), so they run on any 64-bit Windows 10/11.
      - name: Publish self-contained (portable)
        run: |
          dotnet publish PdfEdit/PdfEdit.csproj `
            -c Release -r win-x64 `
            --self-contained true `
            -o publish_portable `
            /p:Version=$env:VERSION `
            /p:AssemblyVersion=$env:VERSION4 `
            /p:FileVersion=$env:VERSION4 `
            /p:PublishSingleFile=false `
            /p:DebugType=none `
            /p:DebugSymbols=false

      - name: Verify publish output
        shell: pwsh
        run: |
          if (-not (Test-Path "publish_portable\PdfEdit.exe")) { throw "publish_portable\PdfEdit.exe not found: publish step failed" }

      - name: Build portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish_portable\* -DestinationPath "dist\PdfEdit-$env:VERSION-win-x64-portable.zip" -CompressionLevel Optimal -Force
          Get-ChildItem dist\*.zip | ForEach-Object { Write-Host "$($_.Name)  $([Math]::Round($_.Length/1MB,1)) MB" }

      # ── Inno Setup EXE installer ─────────────────────────────────────────
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          # GitHub's Windows runners already ship Inno Setup 6; install only if it's missing.
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            Write-Host "Inno Setup already installed"
          } else {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }

      - name: Build EXE installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "ISCC.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          # Self-contained: .NET is bundled, so the installer needs nothing else on the PC.
          & $iscc installer\PdfEditSetup.iss `
            /DMyAppVersion=$env:VERSION `
            /DSELF_CONTAINED=1 `
            "/DAppSource=..\publish_portable" `
            "/O$((Resolve-Path dist).Path)"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          # Rename to include version
          $src = Get-ChildItem dist\*.exe | Select-Object -First 1
          if ($src -and $src.BaseName -notmatch $env:VERSION) {
            Rename-Item $src "PdfEditSetup-$env:VERSION.exe"
          }
          Write-Host "EXE installer: $(Get-ChildItem dist\*.exe)"

      # ── Collect artifacts ────────────────────────────────────────────────
      - name: List dist
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Get-ChildItem dist | ForEach-Object {
              Write-Host "$($_.Name)  $([Math]::Round($_.Length/1KB)) KB"
            }
          } else { Write-Host "No dist folder (all packaging steps skipped)" }

      - name: Keep the files for the release
        uses: actions/upload-artifact@v4
        with:
          name: PdfEdit-${{ env.VERSION }}-windows
          path: |
            dist/PdfEditSetup-${{ env.VERSION }}.exe
            dist/PdfEdit-${{ env.VERSION }}-win-x64-portable.zip
          if-no-files-found: error
          retention-days: 30

  # ── Job 3: PdfEdit for Linux (the Avalonia app): AppImage and tarball ───────
  linux:
    name: Linux AppImage and tarball
    runs-on: ubuntu-latest
    needs: metadata
    if: needs.metadata.outputs.release != 'false'
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install appimagetool's helpers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils

      - name: Build the AppImage and tarball
        run: bash installer/desktop/build-linux.sh "$VERSION"

      - name: Keep the files for the release
        uses: actions/upload-artifact@v4
        with:
          name: PdfEdit-${{ env.VERSION }}-linux
          path: |
            dist/PdfEdit-Desktop-${{ env.VERSION }}-linux-x64.AppImage
            dist/PdfEdit-Desktop-${{ env.VERSION }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  # ── Job 4: PdfEdit for Mac (the Avalonia app): Apple silicon and Intel ───────
  # Signed and notarized when these repository secrets are set; otherwise signed ad hoc (the app then
  # opens after right-click → Open the first time):
  #   MACOS_CERT_P12 (base64 of a "Developer ID Application" .p12), MACOS_CERT_PASSWORD,
  #   MACOS_SIGN_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
  mac:
    name: Mac disk images
    runs-on: macos-latest
    needs: metadata
    if: needs.metadata.outputs.release != 'false'
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Import the signing certificate (if set)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERT_P12" ]]; then echo "No certificate: the app will be signed ad hoc."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build PdfEdit.app and the disk images
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash installer/desktop/build-mac.sh "$VERSION" "arm64 x64"

      - name: Keep the files for the release
        uses: actions/upload-artifact@v4
        with:
          name: PdfEdit-${{ env.VERSION }}-mac
          path: dist/PdfEdit-Desktop-${{ env.VERSION }}-mac-*.dmg
          if-no-files-found: error
          retention-days: 30

  # ── Job 5: Publish the release, once, with every file ─────────────────────────
  # Waits for all three builds. Windows is required; if the Mac or Linux build fails, the release
  # still goes out with the files that were built (and that job's failure shows on the run).
  publish:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: [metadata, windows, linux, mac]
    if: always() && needs.metadata.outputs.release != 'false' && needs.windows.result == 'success'
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can compare commits for changelog

      - name: Collect the files
        uses: actions/download-artifact@v4
        with:
          pattern: PdfEdit-${{ env.VERSION }}-*
          path: dist
          merge-multiple: true

      - name: List the files
        run: ls -la dist

      # ── Generate changelog ───────────────────────────────────────────────
      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          # Compare with previous tag; fall back to last 20 commits
          # (|| true: no earlier tags makes grep exit 1, which -o pipefail would treat as a failure)
          PREV_TAG=$(git tag --sort=-version:refname | { grep -vx "${{ needs.metadata.outputs.tag }}" || true; } | head -1)
          if [[ -n "$PREV_TAG" ]]; then
            RANGE="${PREV_TAG}..HEAD"   # the new tag is created by the release step below
          else
            RANGE="HEAD~20..HEAD"
            git rev-parse -q --verify HEAD~20 >/dev/null || RANGE="HEAD"
          fi
          LOG=$(git log "$RANGE" --pretty="format:- %s (%h)" --no-merges 2>/dev/null | head -50 || true)
          if [[ -z "$LOG" ]]; then LOG="- Initial release"; fi
          echo "log<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG"      >> "$GITHUB_OUTPUT"
          echo "EOF"        >> "$GITHUB_OUTPUT"

      # ── Create GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name:       PdfEdit ${{ env.VERSION }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          draft:      false
          body: |
            ## PdfEdit ${{ env.VERSION }}

            Fill in, sign, edit and design PDFs. Free and open source, for Windows, Mac and Linux.

            ### What's new
            ${{ steps.changelog.outputs.log }}

            ---

            ### Windows
            Windows 10 (version 2004) or 11, 64-bit. Everything is included (.NET is bundled).
            - `PdfEditSetup-${{ env.VERSION }}.exe` — installer *(recommended)*
            - `PdfEdit-${{ env.VERSION }}-win-x64-portable.zip` — no install: unzip anywhere and run `PdfEdit.exe`

            ### Mac
            macOS 12 or later. Open the disk image and drag PdfEdit to Applications.
            - `PdfEdit-Desktop-${{ env.VERSION }}-mac-arm64.dmg` — Apple silicon (M1 and later)
            - `PdfEdit-Desktop-${{ env.VERSION }}-mac-x64.dmg` — Intel Macs

            ### Linux
            64-bit, .NET included. Needs WebKitGTK, which most desktops have (if not: `sudo apt install libwebkit2gtk-4.1-0`, or `webkit2gtk4.1` on Fedora).
            - `PdfEdit-Desktop-${{ env.VERSION }}-linux-x64.AppImage` — make it executable (`chmod +x`) and run it
            - `PdfEdit-Desktop-${{ env.VERSION }}-linux-x64.tar.gz` — unpack anywhere and run `./PdfEdit`

          files: dist/*
          fail_on_unmatched_files: true
