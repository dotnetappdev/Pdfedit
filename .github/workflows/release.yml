name: Build & Release

on:
  # Every push to main (e.g. merging devmain) builds and publishes a release automatically:
  # the version is the next patch after the latest v* tag (or the csproj <Version> if higher).
  # devmain (where development happens): a release is published whenever the csproj <Version>
  # has not been released yet — bump <Version> in PdfEdit/PdfEdit.csproj to ship the next one.
  push:
    branches: [main, devmain]
    paths-ignore:
      - '**.md'
      - 'docs/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # e.g. v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # e.g. v1.2.3-beta.1

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3). Leave blank to read from csproj.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      build_exe:
        description: 'Build EXE installer?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      build_msix:
        description: 'Build MSIX package?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write   # needed to create releases and upload assets

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  # ── Job 1: Resolve version and metadata ───────────────────────────────────
  metadata:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version:     ${{ steps.ver.outputs.version }}
      version4:    ${{ steps.ver.outputs.version4 }}
      tag:         ${{ steps.ver.outputs.tag }}
      prerelease:  ${{ steps.ver.outputs.prerelease }}
      release:     ${{ steps.ver.outputs.release }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, to find the latest release

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # Priority: tag > workflow_dispatch input > csproj
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            # Is it a pre-release? (has a hyphen suffix like -beta.1)
            if [[ "$VERSION" == *-* ]]; then PRE=true; else PRE=false; fi
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
            PRE="${{ github.event.inputs.prerelease }}"
          elif [[ "$GITHUB_REF" == refs/heads/devmain ]]; then
            # devmain: release the csproj version once (skip if that tag already exists).
            VERSION=$(grep -oP '(?<=<Version>)[^<]+' PdfEdit/PdfEdit.csproj | head -1)
            TAG="v${VERSION}"
            PRE=false
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "$TAG is already released — bump <Version> in PdfEdit/PdfEdit.csproj to publish a new release."
            fi
          else
            # main: next patch after the latest release tag, or the csproj version if newer.
            CSPROJ=$(grep -oP '(?<=<Version>)[^<]+' PdfEdit/PdfEdit.csproj | head -1)
            LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -vE -- '-' | sed 's/^v//' | sort -V | tail -1)
            if [[ -z "$LATEST" ]]; then
              VERSION="$CSPROJ"
            else
              IFS=. read -r MA MI PA <<< "$LATEST"
              NEXT="$MA.$MI.$((PA + 1))"
              # csproj wins when someone bumped it past the last release (e.g. 1.1.0)
              if [[ "$(printf '%s\n%s\n' "$NEXT" "$CSPROJ" | sort -V | tail -1)" == "$CSPROJ" && "$CSPROJ" != "$LATEST" ]]; then
                VERSION="$CSPROJ"
              else
                VERSION="$NEXT"
              fi
            fi
            TAG="v${VERSION}"
            PRE=false
          fi

          # Build 4-part version for MSIX (must be x.y.z.0)
          BASE="${VERSION%%-*}"          # strip pre-release suffix
          PARTS=$(echo "$BASE" | tr '.' '\n' | wc -l)
          if [[ $PARTS -eq 3 ]]; then VERSION4="${BASE}.0"; else VERSION4="${BASE}"; fi

          echo "version=$VERSION"    >> "$GITHUB_OUTPUT"
          echo "version4=$VERSION4"  >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE"     >> "$GITHUB_OUTPUT"
          echo "Resolved: version=$VERSION  version4=$VERSION4  tag=$TAG  prerelease=$PRE"

  # ── Job 2: Build, package, release ────────────────────────────────────────
  build-and-release:
    name: Build & Release
    runs-on: windows-latest
    needs: metadata
    if: needs.metadata.outputs.release != 'false'

    env:
      VERSION:   ${{ needs.metadata.outputs.version }}
      VERSION4:  ${{ needs.metadata.outputs.version4 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can compare commits for changelog

      # ── .NET ────────────────────────────────────────────────────────────────
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Restore
        run: dotnet restore PdfEdit/PdfEdit.csproj

      - name: Build (Release)
        run: |
          dotnet build PdfEdit/PdfEdit.csproj `
            -c Release --no-restore `
            /p:Version=$env:VERSION `
            /p:AssemblyVersion=$env:VERSION4 `
            /p:FileVersion=$env:VERSION4

      # ── Publish (framework-dependent, win-x64) ────────────────────────────
      - name: Publish
        run: |
          dotnet publish PdfEdit/PdfEdit.csproj `
            -c Release -r win-x64 `
            --self-contained false `
            -o publish `
            /p:Version=$env:VERSION `
            /p:AssemblyVersion=$env:VERSION4 `
            /p:FileVersion=$env:VERSION4 `
            /p:PublishSingleFile=false `
            /p:DebugType=none `
            /p:DebugSymbols=false

      - name: Verify publish output
        shell: pwsh
        run: |
          if (-not (Test-Path "publish\PdfEdit.exe")) {
            throw "publish\PdfEdit.exe not found — publish step failed"
          }
          Write-Host "Publish OK. Contents:"
          Get-ChildItem publish | Select-Object Name, Length | Format-Table

      # ── ZIP packages ──────────────────────────────────────────────────────
      # PdfEdit-<v>-win-x64.zip            : needs the .NET 10 Desktop Runtime (small)
      # PdfEdit-<v>-win-x64-portable.zip   : self-contained, runs on any 64-bit Windows 10/11
      - name: Publish self-contained (portable)
        run: |
          dotnet publish PdfEdit/PdfEdit.csproj `
            -c Release -r win-x64 `
            --self-contained true `
            -o publish_portable `
            /p:Version=$env:VERSION `
            /p:AssemblyVersion=$env:VERSION4 `
            /p:FileVersion=$env:VERSION4 `
            /p:PublishSingleFile=false `
            /p:DebugType=none `
            /p:DebugSymbols=false

      - name: Build ZIP packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish\* -DestinationPath "dist\PdfEdit-$env:VERSION-win-x64.zip" -CompressionLevel Optimal -Force
          Compress-Archive -Path publish_portable\* -DestinationPath "dist\PdfEdit-$env:VERSION-win-x64-portable.zip" -CompressionLevel Optimal -Force
          Get-ChildItem dist\*.zip | ForEach-Object { Write-Host "$($_.Name)  $([Math]::Round($_.Length/1MB,1)) MB" }

      # ── Inno Setup EXE installer ─────────────────────────────────────────
      - name: Install Inno Setup 6
        if: ${{ github.event.inputs.build_exe != 'false' }}
        shell: pwsh
        run: |
          # GitHub's Windows runners already ship Inno Setup 6; install only if it's missing.
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            Write-Host "Inno Setup already installed"
          } else {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }

      - name: Build EXE installer
        if: ${{ github.event.inputs.build_exe != 'false' }}
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "ISCC.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          # Self-contained: .NET is bundled, so the installer needs nothing else on the PC.
          & $iscc installer\PdfEditSetup.iss `
            /DMyAppVersion=$env:VERSION `
            /DSELF_CONTAINED=1 `
            "/DAppSource=..\publish_portable" `
            "/O$((Resolve-Path dist).Path)"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          # Rename to include version
          $src = Get-ChildItem dist\*.exe | Select-Object -First 1
          if ($src -and $src.BaseName -notmatch $env:VERSION) {
            Rename-Item $src "PdfEditSetup-$env:VERSION.exe"
          }
          Write-Host "EXE installer: $(Get-ChildItem dist\*.exe)"

      # ── MSIX package ────────────────────────────────────────────────────
      - name: Find makeappx.exe
        if: ${{ github.event.inputs.build_msix != 'false' }}
        continue-on-error: true
        id: makeappx
        shell: pwsh
        run: |
          $exe = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" `
                 -ErrorAction SilentlyContinue |
                 Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
                 Select-Object -First 1
          if (-not $exe) { throw "makeappx.exe not found. Windows SDK must be installed." }
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "makeappx: $($exe.FullName)"

      - name: Find signtool.exe
        if: ${{ github.event.inputs.build_msix != 'false' }}
        continue-on-error: true
        id: signtool
        shell: pwsh
        run: |
          $exe = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" `
                 -ErrorAction SilentlyContinue |
                 Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
                 Select-Object -First 1
          if (-not $exe) { throw "signtool.exe not found." }
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build MSIX package
        if: ${{ github.event.inputs.build_msix != 'false' }}
        # An MSIX problem must not stop the EXE / ZIP release from being published.
        continue-on-error: true
        shell: pwsh
        env:
          MAKEAPPX: ${{ steps.makeappx.outputs.path }}
          SIGNTOOL:  ${{ steps.signtool.outputs.path }}
        run: |
          # Stage layout
          $stage = "_msix_stage"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory $stage | Out-Null

          # Copy the self-contained app (an MSIX can't install the .NET runtime for us)
          Copy-Item "publish_portable\*" $stage -Recurse -Force

          # Patch version in manifest
          $manifest = Get-Content installer\Package.appxmanifest -Raw
          # Only the package Identity's Version (not <?xml version>, MinVersion, MaxVersionTested).
          $manifest = [regex]::Replace($manifest, '(?s)(<Identity\b[^>]*?\sVersion=")[\d.]+(")', "`${1}$env:VERSION4`${2}")
          Set-Content "$stage\AppxManifest.xml" $manifest

          # Generate tile assets
          $assetsDir = "$stage\Assets"
          New-Item -ItemType Directory -Force $assetsDir | Out-Null
          Add-Type -AssemblyName System.Drawing
          $tiles = @{
            "Square44x44Logo.png"   = @(44,  44)
            "Square150x150Logo.png" = @(150, 150)
            "Wide310x150Logo.png"   = @(310, 150)
            "Square310x310Logo.png" = @(310, 310)
            "StoreLogo.png"         = @(50,  50)
            "SplashScreen.png"      = @(620, 300)
          }
          foreach ($tile in $tiles.GetEnumerator()) {
            $dest = "$assetsDir\$($tile.Key)"
            $src  = "PdfEdit\Resources\$($tile.Key)"
            if (Test-Path $src) { Copy-Item $src $dest; continue }
            $w, $h = $tile.Value
            $bmp = New-Object System.Drawing.Bitmap($w, $h)
            $g   = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(40, 80, 160))
            $br  = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
            $fnt = New-Object System.Drawing.Font("Segoe UI", [Math]::Max(8, $w / 8), [System.Drawing.FontStyle]::Bold)
            $sf  = New-Object System.Drawing.StringFormat
            $sf.Alignment = [System.Drawing.StringAlignment]::Center
            $sf.LineAlignment = [System.Drawing.StringAlignment]::Center
            $g.DrawString("PDF", $fnt, $br, [System.Drawing.RectangleF]::new(0,0,$w,$h), $sf)
            $bmp.Save($dest, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }

          # Pack
          New-Item -ItemType Directory -Force dist | Out-Null
          $msix = "dist\PdfEdit-$env:VERSION4.msix"
          & $env:MAKEAPPX pack /d $stage /p $msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed" }

          # Self-signed cert (CI test signing — users must trust before install)
          $certSubject = "CN=PdfEdit"
          $cert = New-SelfSignedCertificate `
            -Subject $certSubject `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyUsage DigitalSignature `
            -Type CodeSigningCert `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(2)

          & $env:SIGNTOOL sign /fd SHA256 /sha1 $cert.Thumbprint $msix
          if ($LASTEXITCODE -ne 0) { Write-Warning "signtool returned $LASTEXITCODE (non-fatal for test cert)" }

          # Export the test cert so users can import and trust it
          $pfxPass = ConvertTo-SecureString "PdfEditTestCert" -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath "dist\PdfEdit-TestCert.pfx" -Password $pfxPass
          Export-Certificate   -Cert $cert -FilePath "dist\PdfEdit-TestCert.cer"

          Remove-Item $stage -Recurse -Force
          Write-Host "MSIX: $msix"

      # ── Collect artifacts ────────────────────────────────────────────────
      - name: List dist
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Get-ChildItem dist | ForEach-Object {
              Write-Host "$($_.Name)  $([Math]::Round($_.Length/1KB)) KB"
            }
          } else { Write-Host "No dist folder (all packaging steps skipped)" }

      - name: Upload build artifacts (always kept for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: PdfEdit-${{ env.VERSION }}-artifacts
          path: dist/
          if-no-files-found: warn
          retention-days: 30

      # ── Generate changelog ───────────────────────────────────────────────
      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          # Compare with previous tag; fall back to last 20 commits
          # (|| true: no earlier tags makes grep exit 1, which -o pipefail would treat as a failure)
          PREV_TAG=$(git tag --sort=-version:refname | { grep -vx "${{ needs.metadata.outputs.tag }}" || true; } | head -1)
          if [[ -n "$PREV_TAG" ]]; then
            RANGE="${PREV_TAG}..HEAD"   # the new tag is created by the release step below
          else
            RANGE="HEAD~20..HEAD"
            git rev-parse -q --verify HEAD~20 >/dev/null || RANGE="HEAD"
          fi
          LOG=$(git log "$RANGE" --pretty="format:- %s (%h)" --no-merges 2>/dev/null | head -50 || true)
          if [[ -z "$LOG" ]]; then LOG="- Initial release"; fi
          echo "log<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG"      >> "$GITHUB_OUTPUT"
          echo "EOF"        >> "$GITHUB_OUTPUT"

      # ── Create GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name:       PdfEdit ${{ env.VERSION }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          draft:      false
          body: |
            ## PdfEdit ${{ env.VERSION }}

            A professional WPF PDF form filler, editor, and design tool for Windows.

            ### What's new
            ${{ steps.changelog.outputs.log }}

            ---

            ### Installation

            #### Option A — EXE Installer *(recommended)*
            1. Download `PdfEditSetup-${{ env.VERSION }}.exe`
            2. Run it — everything is included (.NET is bundled), nothing else to install

            #### Option B — ZIP (no install)
            - `PdfEdit-${{ env.VERSION }}-win-x64-portable.zip` — unzip anywhere and run `PdfEdit.exe`; nothing else needed
            - `PdfEdit-${{ env.VERSION }}-win-x64.zip` — smaller, needs the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0)

            #### Option C — MSIX Package
            1. Download `PdfEdit-${{ env.VERSION4 }}.msix`
            2. Trust the test certificate first (one-time):
               ```powershell
               # Run as Administrator
               Import-Certificate -FilePath PdfEdit-TestCert.cer `
                 -CertStoreLocation Cert:\LocalMachine\TrustedPeople
               ```
            3. Double-click the `.msix` to install

            > **Note:** The MSIX is signed with a self-signed test certificate for this open-source build.
            > A production release would use an EV code-signing certificate.

            ### System Requirements
            - Windows 10 v2004 (build 19041) or later, 64-bit
            - [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) *(EXE installer handles this)*

          files: |
            dist/PdfEdit-${{ env.VERSION }}-win-x64.zip
            dist/PdfEdit-${{ env.VERSION }}-win-x64-portable.zip
            dist/PdfEditSetup-${{ env.VERSION }}.exe
            dist/PdfEdit-${{ env.VERSION4 }}.msix
            dist/PdfEdit-TestCert.cer
          fail_on_unmatched_files: false

  # ── Job 3: PdfEdit Desktop (the cross-platform Avalonia app) for Windows ──────
  # Runs after the release exists and adds its own installer to it, so a problem here never holds
  # up the Windows (WPF) release.
  desktop-windows:
    name: PdfEdit Desktop — Windows installer
    runs-on: windows-latest
    needs: [metadata, build-and-release]
    if: needs.metadata.outputs.release != 'false'
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }

      - name: Build installer and portable ZIP
        shell: pwsh
        run: pwsh installer/desktop/build-windows.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: PdfEdit-Desktop-${{ env.VERSION }}-windows
          path: |
            dist/PdfEdit-Desktop-Setup-${{ env.VERSION }}.exe
            dist/PdfEdit-Desktop-${{ env.VERSION }}-win-x64.zip
          retention-days: 30

      - name: Add to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          append_body: true
          body: |

            ### PdfEdit Desktop for Windows (cross-platform version)
            The web version's interface in a desktop window ([what's different](https://github.com/dotnetappdev/pdfedit/blob/devmain/docs/building.md#the-cross-platform-desktop-app-windows-macos-linux)). Installs alongside the Windows app above.
            - `PdfEdit-Desktop-Setup-${{ env.VERSION }}.exe` — installer (.NET included; installs Microsoft's WebView2 runtime if your PC hasn't got it)
            - `PdfEdit-Desktop-${{ env.VERSION }}-win-x64.zip` — no install: unzip and run `PdfEdit.exe`
          files: |
            dist/PdfEdit-Desktop-Setup-${{ env.VERSION }}.exe
            dist/PdfEdit-Desktop-${{ env.VERSION }}-win-x64.zip
          fail_on_unmatched_files: true

  # ── Job 4: PdfEdit Desktop for macOS (Apple silicon and Intel) ─────────────────
  # Signed and notarized when these repository secrets are set; otherwise signed ad hoc (the app then
  # opens after right-click → Open the first time):
  #   MACOS_CERT_P12 (base64 of a "Developer ID Application" .p12), MACOS_CERT_PASSWORD,
  #   MACOS_SIGN_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
  desktop-mac:
    name: PdfEdit Desktop — macOS disk images
    runs-on: macos-latest
    needs: [metadata, build-and-release]
    if: needs.metadata.outputs.release != 'false'
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Import the signing certificate (if set)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERT_P12" ]]; then echo "No certificate: the app will be signed ad hoc."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build PdfEdit.app and the disk images
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash installer/desktop/build-mac.sh "$VERSION" "arm64 x64"

      - uses: actions/upload-artifact@v4
        with:
          name: PdfEdit-Desktop-${{ env.VERSION }}-mac
          path: dist/PdfEdit-Desktop-${{ env.VERSION }}-mac-*.dmg
          retention-days: 30

      - name: Add to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          append_body: true
          body: |

            ### PdfEdit Desktop for Mac
            Open the disk image and drag PdfEdit to Applications. macOS 12 or later; nothing else to install.
            - `PdfEdit-Desktop-${{ env.VERSION }}-mac-arm64.dmg` — Apple silicon (M1 and later)
            - `PdfEdit-Desktop-${{ env.VERSION }}-mac-x64.dmg` — Intel Macs
          files: dist/PdfEdit-Desktop-${{ env.VERSION }}-mac-*.dmg
          fail_on_unmatched_files: true
