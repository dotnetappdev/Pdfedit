name: PdfEdit Desktop installers

# Builds the PdfEdit Desktop (Avalonia) packages for Linux and macOS and keeps them as
# downloadable artifacts on the run's page — for trying a build without making a release.
# (Releases get them too: see the desktop-linux and desktop-mac jobs in release.yml.)
on:
  workflow_dispatch:
  push:
    branches: [devmain]
    paths:
      - 'PdfEdit.Avalonia/**'
      - 'installer/desktop/**'
      - '.github/workflows/desktop-installers.yml'

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install appimagetool's helpers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils
      - name: Build
        run: bash installer/desktop/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PdfEdit-Desktop-linux
          path: |
            dist/PdfEdit-Desktop-*-linux-x64.AppImage
            dist/PdfEdit-Desktop-*-linux-x64.tar.gz
          retention-days: 14

  mac:
    name: macOS disk images
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build (signed ad hoc)
        run: bash installer/desktop/build-mac.sh "" "arm64 x64"
      - uses: actions/upload-artifact@v4
        with:
          name: PdfEdit-Desktop-mac
          path: dist/PdfEdit-Desktop-*-mac-*.dmg
          retention-days: 14
