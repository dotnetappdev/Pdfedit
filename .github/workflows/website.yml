name: Website

# Builds the PdfEdit website (staticsite/): the download pages, plus the user guide made from docs/*.md
# and the tutorials in staticsite/content, and publishes it on GitHub Pages. The downloads and
# "What's new" come from the GitHub releases, fetched fresh on every build — so the site updates
# itself after each release (when Build & Release finishes), daily, and whenever the site changes.
#
# Publishing: through GitHub Pages' Actions deployment when Pages is on (Settings → Pages → Source:
# GitHub Actions; the workflow also asks for it to be turned on). If it isn't, the site is pushed to
# the gh-pages branch instead — choose Settings → Pages → Deploy from a branch: gh-pages / (root).
on:
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]
  push:
    branches: [devmain]
    paths:
      - 'staticsite/**'
      - 'docs/**'
      - 'PdfEdit.Blazor/README.md'
      - '.github/workflows/website.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # the gh-pages fallback
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: staticsite/package-lock.json

      - name: Install the site's tools
        run: npm ci --prefix staticsite --no-audit --no-fund

      - name: Fetch the latest releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node staticsite/tools/update-releases.mjs

      - name: Build the site
        env:
          ASK_ENDPOINT: ${{ vars.ASK_ENDPOINT }}   # the "Ask the guide" Worker, if there is one
        run: node staticsite/tools/build.mjs

      # ── GitHub Pages (Actions deployment) ──
      - name: Set up GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Upload the site for Pages
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: staticsite/_site

      - name: Publish on GitHub Pages
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      # ── Fallback: the gh-pages branch ──
      - name: Publish to the gh-pages branch (Pages isn't set to GitHub Actions)
        if: steps.pages.outcome != 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: staticsite/_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Website ${{ github.sha }}'

      - name: Where the site is
        run: |
          if [[ "${{ steps.pages.outcome }}" == "success" ]]; then
            echo "Published: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "The site was pushed to the **gh-pages** branch."
              echo "To put it online: Settings → Pages → Build and deployment → Source: *Deploy from a branch*, Branch: **gh-pages** / (root)."
              echo "Or choose Source: *GitHub Actions* and this workflow deploys it directly next time."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
