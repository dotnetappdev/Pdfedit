name: Website

# Builds the PdfEdit website (staticsite/): the download pages, plus the user guide made from docs/*.md
# and the tutorials in staticsite/content, and publishes it on GitHub Pages. The downloads and
# "What's new" come from the GitHub releases, fetched fresh on every build — so the site updates
# itself after each release (when Build & Release finishes), daily, and whenever the site changes.
#
# Publishing: through GitHub Pages' Actions deployment when Pages is on (Settings → Pages → Source:
# GitHub Actions; the workflow also asks for it to be turned on). If it isn't, the site is pushed to
# the gh-pages branch instead — choose Settings → Pages → Deploy from a branch: gh-pages / (root).
on:
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]
  push:
    branches: [devmain]
    paths:
      - 'staticsite/**'
      - 'docs/**'
      - 'PdfEdit.Blazor/README.md'
      - '.github/workflows/website.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # the gh-pages fallback
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: staticsite/package-lock.json

      - name: Install the site's tools
        run: npm ci --prefix staticsite --no-audit --no-fund

      - name: Fetch the latest releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node staticsite/tools/update-releases.mjs

      - name: Build the site
        env:
          ASK_ENDPOINT: ${{ vars.ASK_ENDPOINT }}   # the "Ask the guide" Worker, if there is one
        run: node staticsite/tools/build.mjs

      # ── How Pages is set up decides how the site is published ──
      # Settings → Pages → Source "GitHub Actions" (build_type "workflow"): deployed directly.
      # "Deploy from a branch" (or Pages not on yet): pushed to gh-pages — choose gh-pages / (root).
      - name: Check the GitHub Pages setting
        id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          info=$(gh api "repos/${{ github.repository }}/pages" 2>/dev/null || echo '{}')
          type=$(echo "$info" | jq -r '.build_type // "off"')
          branch=$(echo "$info" | jq -r '.source.branch // ""')
          url=$(echo "$info" | jq -r '.html_url // ""')
          echo "Pages: build_type=$type branch=$branch url=$url"
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set up GitHub Pages
        if: steps.mode.outputs.type == 'workflow'
        uses: actions/configure-pages@v5

      - name: Upload the site for Pages
        if: steps.mode.outputs.type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: staticsite/_site

      - name: Publish on GitHub Pages
        id: deployment
        if: steps.mode.outputs.type == 'workflow'
        uses: actions/deploy-pages@v4

      - name: Publish to the gh-pages branch
        if: steps.mode.outputs.type != 'workflow'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: staticsite/_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Website ${{ github.sha }}'

      - name: Where the site is
        run: |
          type="${{ steps.mode.outputs.type }}"; branch="${{ steps.mode.outputs.branch }}"
          if [[ "$type" == "workflow" ]]; then
            echo "Published: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$branch" == "gh-pages" ]]; then
            echo "Pushed to **gh-pages**; GitHub Pages publishes it at ${{ steps.mode.outputs.url }} in a minute or two." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "The site was pushed to the **gh-pages** branch, but Pages isn't publishing that branch (it's set to: ${branch:-off})."
              echo "To put it online: Settings → Pages → Build and deployment → Source: *Deploy from a branch*, Branch: **gh-pages** / (root) → Save."
              echo "::warning::GitHub Pages is set to '${branch:-off}'. Choose gh-pages / (root) in Settings → Pages."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GitHub Pages is set to '${branch:-off}', not gh-pages. Choose gh-pages / (root) in Settings → Pages."
          fi
