name: Website

# Builds the PdfEdit website (staticsite/) and publishes it on GitHub Pages. The downloads and
# "What's new" come from the GitHub releases, fetched fresh on every build — so the site updates
# itself after each release (when Build & Release finishes), daily, and whenever the site changes.
# One-time set-up: repository Settings → Pages → Source: GitHub Actions.
on:
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]
  push:
    branches: [devmain]
    paths:
      - 'staticsite/**'
      - 'docs/screenshots/**'
      - '.github/workflows/website.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the latest releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node staticsite/tools/update-releases.mjs
      - name: Build the site
        run: node staticsite/tools/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: staticsite/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
